# 1. احذف الملف المعطل (اختياري لو مازال موجود)
rm -f .github/workflows/ci.yaml

# 2. أنشئ الملف الجديد بشكل سليم
mkdir -p .github/workflows

cat > .github/workflows/push-logger.yml << 'EOF'
name: Push Logger to README

on:
  push:
    branches:
      - model-test

jobs:
  log-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Log Push
      run: |
        echo "## Push Log - $(date)" >> README.md
        echo "**Developer:** ${{ github.actor }}" >> README.md
        echo "**Branch:** ${{ github.ref_name }}" >> README.md
        echo "---" >> README.md

    - name: Commit
      env:
        TOKEN: ${{ secrets.PAT_TOKEN }}
      run: |
        git config user.name "GitHub Action"
        git config user.email "action@github.com"
        git add README.md
        git commit -m "Auto-update README" || echo "No changes to commit"
        git remote set-url origin https://x-access-token:${TOKEN}@github.com/${{ github.repository }}
        git push origin HEAD
EOF
