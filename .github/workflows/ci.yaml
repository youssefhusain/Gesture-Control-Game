# امسح الملف المعطل
rm .github/workflows/ci.yaml

# أنشئ الملف الصح
cat > .github/workflows/push-logger.yml << 'EOF'
name: Push Logger to README

on:
  push:
    branches:
      - model-test

jobs:
  log-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Log Push
      run: |
        echo "## Push Log - $(date)" >> README.md
        echo "**Developer:** ${{ github.actor }}" >> README.md
        echo "**Branch:** ${{ github.ref_name }}" >> README.md
        echo "---" >> README.md

    - name: Commit
      run: |
        git config user.name "GitHub Action"
        git config user.email "action@github.com"
        git add README.md
        git commit -m "Auto-update README" || exit 0
        git push
EOF